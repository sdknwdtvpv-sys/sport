<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练了么 · 休息倒计时</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary-50: #FFF3EE;
    --primary-300: #FF9E7C;
    --primary-400: #FF7D50;
    --primary-500: #FF5C26;
    --primary-600: #E04A18;
    --primary-700: #B83810;
    --primary-800: #8F2A0C;
    --neutral-50: #F5F3F1;
    --neutral-400: #8A8176;
    --neutral-500: #6B6157;
    --neutral-700: #38322C;
    --neutral-800: #24201C;
    --neutral-900: #141210;
    --bg: #0E0C0A;
    --surface: #1A1714;
    --fg: #F5F3F1;
    --success-500: #10B981;
    --success-400: #34D399;
    --warning-500: #F59E0B;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 20px;
    --radius-full: 9999px;
    --font-display: 'Oswald', 'Noto Sans SC', sans-serif;
    --font-body: 'Noto Sans SC', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  body {
    background: #0a0908;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 60px 20px 40px;
    font-family: var(--font-body);
    gap: 48px;
  }

  .page-title {
    text-align: center;
    color: var(--fg);
  }

  .page-title h1 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .page-title p {
    font-size: 14px;
    color: var(--neutral-400);
  }

  .phones-row {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }

  .phone-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .phone-label {
    font-size: 12px;
    color: var(--neutral-500);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .phone-frame {
    width: 340px;
    height: 730px;
    background: var(--bg);
    border-radius: 44px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 40px 80px -20px rgba(0,0,0,0.8);
  }

  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 26px;
    background: #000;
    border-radius: 0 0 16px 16px;
    z-index: 10;
  }

  .status-bar {
    position: absolute;
    top: 12px;
    left: 0;
    right: 0;
    height: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 28px;
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    z-index: 5;
  }

  .rest-screen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 52px 24px 32px;
    position: relative;
    background: radial-gradient(ellipse at 50% 35%, rgba(255,92,38,0.15) 0%, transparent 60%);
  }

  .rest-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
  }

  .close-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg);
    cursor: pointer;
  }

  .close-btn svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
  }

  .set-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--primary-400);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .next-exercise {
    text-align: center;
    margin-bottom: 40px;
  }

  .next-label {
    font-size: 13px;
    color: var(--neutral-400);
    margin-bottom: 6px;
  }

  .next-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--fg);
  }

  .next-detail {
    font-size: 14px;
    color: var(--neutral-400);
    margin-top: 4px;
    font-family: var(--font-mono);
  }

  .timer-circle-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 40px;
  }

  .timer-circle {
    width: 240px;
    height: 240px;
    position: relative;
  }

  .timer-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.08);
  }

  .timer-progress {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 4px solid transparent;
    border-top-color: var(--primary-500);
    border-right-color: var(--primary-500);
    transform: rotate(45deg);
    filter: drop-shadow(0 0 12px rgba(255,92,38,0.4));
  }

  .timer-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .timer-time {
    font-family: var(--font-mono);
    font-size: 56px;
    font-weight: 700;
    color: var(--fg);
    line-height: 1;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
  }

  .timer-unit {
    font-size: 13px;
    color: var(--neutral-400);
    margin-top: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .timer-pulse {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,92,38,0.06) 0%, transparent 70%);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    50% { transform: translate(-50%, -50%) scale(1.08); opacity: 0.4; }
  }

  .quick-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 32px;
  }

  .quick-btn {
    padding: 8px 16px;
    border-radius: var(--radius-full);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--fg);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font-body);
  }

  .quick-btn.active {
    background: rgba(255,92,38,0.15);
    border-color: rgba(255,92,38,0.3);
    color: var(--primary-400);
  }

  .control-buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: auto;
    margin-bottom: 20px;
  }

  .ctrl-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .ctrl-btn svg {
    width: 26px;
    height: 26px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .ctrl-btn.secondary {
    background: rgba(255,255,255,0.08);
    color: var(--fg);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .ctrl-btn.primary {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
    color: white;
    box-shadow: 0 8px 24px rgba(255,92,38,0.4);
  }

  .finish-btn {
    width: 100%;
    height: 52px;
    border-radius: var(--radius-full);
    background: linear-gradient(135deg, var(--success-500), #059669);
    color: white;
    font-size: 16px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    font-family: var(--font-body);
    box-shadow: 0 8px 24px rgba(16,185,129,0.3);
  }

  .finished-screen {
    justify-content: center;
    text-align: center;
  }

  .finished-icon {
    width: 100px;
    height: 100px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--success-500), #059669);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 32px rgba(16,185,129,0.4);
  }

  .finished-icon svg {
    width: 48px;
    height: 48px;
    stroke: white;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .finished-title {
    font-size: 28px;
    font-weight: 700;
    color: var(--fg);
    margin-bottom: 8px;
  }

  .finished-sub {
    font-size: 15px;
    color: var(--neutral-400);
    margin-bottom: 32px;
  }

  .finished-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }

  .fstat {
    background: rgba(255,255,255,0.04);
    border-radius: var(--radius-md);
    padding: 16px 8px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .fstat .num {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    color: var(--success-400);
  }

  .fstat .label {
    font-size: 11px;
    color: var(--neutral-400);
    margin-top: 4px;
  }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 4px;
    background: var(--fg);
    border-radius: 2px;
    opacity: 0.8;
  }
</style>
</head>
<body>
  <div class="page-title">
    <h1>REST TIMER</h1>
    <p>休息倒计时 · 两种状态</p>
  </div>

  <div class="phones-row">
    <!-- Timer running -->
    <div class="phone-wrap">
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="status-bar">
          <span>9:41</span>
          <span style="font-size:12px;opacity:0.8">100%</span>
        </div>
        <div class="rest-screen">
          <div class="rest-nav">
            <div class="close-btn">
              <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </div>
            <span class="set-label">第 3 组 · 休息中</span>
            <div style="width:36px;"></div>
          </div>

          <div class="next-exercise">
            <div class="next-label">下一组</div>
            <div class="next-name">上斜哑铃飞鸟</div>
            <div class="next-detail">18 kg × 12 次</div>
          </div>

          <div class="timer-circle-wrap">
            <div class="timer-circle">
              <div class="timer-pulse"></div>
              <div class="timer-bg"></div>
              <div class="timer-progress"></div>
              <div class="timer-center">
                <div class="timer-time">01:24</div>
                <div class="timer-unit">秒</div>
              </div>
            </div>
          </div>

          <div class="quick-buttons">
            <button class="quick-btn">+10s</button>
            <button class="quick-btn active">90s</button>
            <button class="quick-btn">120s</button>
            <button class="quick-btn">180s</button>
          </div>

          <div class="control-buttons">
            <button class="ctrl-btn secondary">
              <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            </button>
            <button class="ctrl-btn primary">
              <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </button>
            <button class="ctrl-btn secondary">
              <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
          </div>

          <button class="finish-btn">跳过休息，开始下一组</button>
        </div>
        <div class="home-indicator"></div>
      </div>
      <div class="phone-label">计时中</div>
    </div>

    <!-- Finished -->
    <div class="phone-wrap">
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="status-bar">
          <span>9:41</span>
          <span style="font-size:12px;opacity:0.8">100%</span>
        </div>
        <div class="rest-screen finished-screen">
          <div class="finished-icon">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="finished-title">休息结束！</div>
          <div class="finished-sub">准备好迎接下一组了吗？</div>

          <div class="finished-stats">
            <div class="fstat">
              <div class="num">90s</div>
              <div class="label">休息时长</div>
            </div>
            <div class="fstat">
              <div class="num">3</div>
              <div class="label">已完成组</div>
            </div>
            <div class="fstat">
              <div class="num">120</div>
              <div class="label">总重量 kg</div>
            </div>
          </div>

          <button class="finish-btn">开始下一组</button>
        </div>
        <div class="home-indicator"></div>
      </div>
      <div class="phone-label">完成态</div>
    </div>
  </div>
</body>
</html>
