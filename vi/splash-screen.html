<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练了么 · 启动页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary-50: #FFF3EE;
    --primary-400: #FF7D50;
    --primary-500: #FF5C26;
    --primary-600: #E04A18;
    --primary-700: #B83810;
    --neutral-50: #F5F3F1;
    --neutral-300: #ABA49A;
    --neutral-500: #6B6157;
    --neutral-700: #38322C;
    --neutral-800: #24201C;
    --neutral-900: #141210;
    --bg: #0E0C0A;
    --fg: #F5F3F1;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-full: 9999px;
    --font-display: 'Oswald', 'Noto Sans SC', sans-serif;
    --font-body: 'Noto Sans SC', sans-serif;
  }

  body {
    background: #0a0908;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    font-family: var(--font-body);
  }

  .phone-frame {
    width: 375px;
    height: 812px;
    background: var(--bg);
    border-radius: 48px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 40px 80px -20px rgba(0,0,0,0.8),
      0 20px 40px -10px rgba(0,0,0,0.5);
  }

  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 30px;
    background: #000;
    border-radius: 0 0 20px 20px;
    z-index: 10;
  }

  .splash-content {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: radial-gradient(ellipse at 50% 40%, rgba(255,92,38,0.12) 0%, transparent 55%),
                var(--bg);
  }

  .splash-content::before {
    content: '';
    position: absolute;
    top: 12%;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,92,38,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .icon-container {
    position: relative;
    margin-bottom: 32px;
  }

  .icon-ring {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 18px solid var(--primary-500);
    position: relative;
    animation: ringPulse 2.5s ease-in-out infinite;
  }

  .icon-ring::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--primary-400);
    box-shadow: 0 0 20px var(--primary-500), 0 0 40px rgba(255,92,38,0.4);
    animation: dotGlow 2.5s ease-in-out infinite;
  }

  @keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.9; }
  }

  @keyframes dotGlow {
    0%, 100% { box-shadow: 0 0 16px var(--primary-500), 0 0 32px rgba(255,92,38,0.3); }
    50% { box-shadow: 0 0 24px var(--primary-400), 0 0 48px rgba(255,92,38,0.5); }
  }

  .app-name {
    font-family: var(--font-display);
    font-size: 42px;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .app-name-cn {
    font-family: var(--font-body);
    font-size: 28px;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: 8px;
    margin-bottom: 12px;
  }

  .tagline {
    font-size: 14px;
    color: var(--neutral-400, #8A8176);
    font-weight: 400;
    letter-spacing: 1px;
  }

  .status-bar {
    position: absolute;
    top: 12px;
    left: 0;
    right: 0;
    height: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 32px;
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    z-index: 5;
  }

  .status-right {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: var(--fg);
    border-radius: 3px;
    opacity: 0.9;
  }

  .loading-indicator {
    position: absolute;
    bottom: 100px;
    display: flex;
    gap: 6px;
  }

  .loading-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary-500);
    opacity: 0.3;
  }

  .loading-dot:nth-child(1) { animation: loadDot 1.4s ease-in-out infinite; }
  .loading-dot:nth-child(2) { animation: loadDot 1.4s ease-in-out 0.2s infinite; }
  .loading-dot:nth-child(3) { animation: loadDot 1.4s ease-in-out 0.4s infinite; }

  @keyframes loadDot {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1.2); }
  }

  .page-label {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-body);
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="page-label">启动页 · Splash Screen</div>
  <div class="phone-frame">
    <div class="notch"></div>
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-right">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="2" width="3" height="10" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5" opacity="0.3"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="0.6" y="2" width="11" height="8" rx="1.5"/><rect x="12.5" y="4" width="1.5" height="4" rx="0.5" fill="currentColor" stroke="none"/><rect x="2" y="3.5" width="8" height="5" rx="0.5" fill="currentColor" stroke="none"/></svg>
      </div>
    </div>
    <div class="splash-content">
      <div class="icon-container">
        <div class="icon-ring"></div>
      </div>
      <div class="app-name-cn">练了么</div>
      <div class="tagline">一次点击，记录一组</div>
      <div class="loading-indicator">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
