<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练了么 · 个人主页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary-50: #FFF3EE;
    --primary-300: #FF9E7C;
    --primary-400: #FF7D50;
    --primary-500: #FF5C26;
    --primary-600: #E04A18;
    --primary-700: #B83810;
    --neutral-50: #F5F3F1;
    --neutral-200: #D1CCC5;
    --neutral-400: #8A8176;
    --neutral-500: #6B6157;
    --neutral-700: #38322C;
    --neutral-800: #24201C;
    --neutral-900: #141210;
    --bg: #0E0C0A;
    --surface: #1A1714;
    --surface-2: #24201C;
    --fg: #F5F3F1;
    --success-500: #10B981;
    --success-400: #34D399;
    --warning-500: #F59E0B;
    --purple-400: #A78BFA;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-full: 9999px;
    --font-display: 'Oswald', 'Noto Sans SC', sans-serif;
    --font-body: 'Noto Sans SC', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  body {
    background: #0a0908;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 60px 20px 40px;
    font-family: var(--font-body);
    gap: 48px;
  }

  .page-title {
    text-align: center;
    color: var(--fg);
  }

  .page-title h1 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .page-title p {
    font-size: 14px;
    color: var(--neutral-400);
  }

  .phone-frame {
    width: 375px;
    height: 812px;
    background: var(--bg);
    border-radius: 48px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 40px 80px -20px rgba(0,0,0,0.8);
    flex-shrink: 0;
  }

  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 30px;
    background: #000;
    border-radius: 0 0 20px 20px;
    z-index: 10;
  }

  .status-bar {
    position: absolute;
    top: 12px;
    left: 0;
    right: 0;
    height: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 32px;
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    z-index: 5;
  }

  .screen-body {
    height: 100%;
    overflow-y: auto;
    padding-bottom: 100px;
  }

  .profile-header {
    padding: 52px 20px 24px;
    position: relative;
    background: linear-gradient(180deg, rgba(255,92,38,0.1) 0%, transparent 100%);
  }

  .top-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 20px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg);
    cursor: pointer;
    position: relative;
  }

  .icon-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .badge-dot {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary-500);
    border: 2px solid var(--bg);
  }

  .profile-info {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }

  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: white;
    font-family: var(--font-display);
    position: relative;
  }

  .avatar::after {
    content: '';
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--success-500);
    border: 3px solid var(--bg);
  }

  .user-info h2 {
    font-size: 20px;
    font-weight: 700;
    color: var(--fg);
    margin-bottom: 4px;
  }

  .user-id {
    font-size: 12px;
    color: var(--neutral-400);
    font-family: var(--font-mono);
  }

  .level-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
    padding: 3px 10px;
    background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(217,119,6,0.2));
    border: 1px solid rgba(245,158,11,0.3);
    border-radius: var(--radius-full);
    font-size: 11px;
    font-weight: 600;
    color: var(--warning-500);
  }

  .level-badge svg {
    width: 12px;
    height: 12px;
    fill: currentColor;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }

  .stat-item {
    text-align: center;
    padding: 12px 4px;
    background: rgba(255,255,255,0.04);
    border-radius: var(--radius-md);
  }

  .stat-num {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    color: var(--fg);
    line-height: 1;
  }

  .stat-label {
    font-size: 10px;
    color: var(--neutral-400);
    margin-top: 4px;
  }

  .streak-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: linear-gradient(135deg, rgba(255,92,38,0.12) 0%, rgba(255,92,38,0.04) 100%);
    border: 1px solid rgba(255,92,38,0.2);
    border-radius: var(--radius-md);
  }

  .streak-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    flex-shrink: 0;
  }

  .streak-icon svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
  }

  .streak-info {
    flex: 1;
  }

  .streak-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 4px;
  }

  .streak-progress {
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: var(--radius-full);
    overflow: hidden;
  }

  .streak-fill {
    height: 100%;
    width: 77%;
    background: linear-gradient(90deg, var(--primary-500), var(--primary-300));
    border-radius: var(--radius-full);
  }

  .streak-days {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    color: var(--primary-400);
    text-align: center;
  }

  .streak-days span {
    font-size: 11px;
    color: var(--neutral-400);
    font-weight: 400;
    font-family: var(--font-body);
    display: block;
  }

  .section-title {
    padding: 20px 20px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .section-title h3 {
    font-size: 15px;
    font-weight: 600;
    color: var(--fg);
  }

  .section-title a {
    font-size: 12px;
    color: var(--neutral-400);
    text-decoration: none;
  }

  .achievement-row {
    display: flex;
    gap: 12px;
    padding: 0 16px;
    overflow-x: auto;
  }

  .badge-item {
    flex-shrink: 0;
    width: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .badge-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .badge-icon svg {
    width: 24px;
    height: 24px;
  }

  .badge-icon.gold {
    background: linear-gradient(135deg, #FBBF24, #D97706);
    box-shadow: 0 4px 12px rgba(245,158,11,0.3);
  }

  .badge-icon.gold svg { stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .badge-icon.purple {
    background: linear-gradient(135deg, var(--purple-400), #7C3AED);
    box-shadow: 0 4px 12px rgba(139,92,246,0.3);
  }

  .badge-icon.purple svg { fill: white; }

  .badge-icon.primary {
    background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
    box-shadow: 0 4px 12px rgba(255,92,38,0.3);
  }

  .badge-icon.primary svg { stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .badge-icon.locked {
    background: var(--neutral-700);
    opacity: 0.5;
  }

  .badge-icon.locked svg { stroke: var(--neutral-500); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .badge-name {
    font-size: 10px;
    color: var(--neutral-400);
    text-align: center;
    line-height: 1.3;
  }

  .menu-list {
    margin: 8px 16px;
    background: var(--surface);
    border-radius: var(--radius-md);
    border: 1px solid rgba(255,255,255,0.04);
    overflow: hidden;
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    cursor: pointer;
  }

  .menu-item:last-child {
    border-bottom: none;
  }

  .menu-icon {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    background: rgba(255,92,38,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-400);
    flex-shrink: 0;
  }

  .menu-icon svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .menu-text {
    flex: 1;
    font-size: 14px;
    color: var(--fg);
    font-weight: 500;
  }

  .menu-arrow {
    color: var(--neutral-500);
  }

  .menu-arrow svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .tab-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(20, 18, 16, 0.92);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 8px 4px 24px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 10;
  }

  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--neutral-500);
    flex: 1;
  }

  .tab-item svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .tab-item span {
    font-size: 10px;
    font-weight: 500;
  }

  .tab-item.active {
    color: var(--primary-500);
  }

  .tab-item.active svg {
    fill: rgba(255, 92, 38, 0.12);
  }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: var(--fg);
    border-radius: 3px;
    opacity: 0.9;
    z-index: 20;
  }
</style>
</head>
