<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练了么 · 引导页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary-50: #FFF3EE;
    --primary-100: #FFE0D4;
    --primary-300: #FF9E7C;
    --primary-400: #FF7D50;
    --primary-500: #FF5C26;
    --primary-600: #E04A18;
    --primary-700: #B83810;
    --neutral-50: #F5F3F1;
    --neutral-300: #ABA49A;
    --neutral-400: #8A8176;
    --neutral-500: #6B6157;
    --neutral-700: #38322C;
    --neutral-800: #24201C;
    --neutral-900: #141210;
    --bg: #0E0C0A;
    --surface: #1A1714;
    --fg: #F5F3F1;
    --success-500: #10B981;
    --info-400: #22D3EE;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 20px;
    --radius-full: 9999px;
    --font-display: 'Oswald', 'Noto Sans SC', sans-serif;
    --font-body: 'Noto Sans SC', sans-serif;
  }

  body {
    background: #0a0908;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 60px 20px 40px;
    font-family: var(--font-body);
    gap: 48px;
  }

  .page-title {
    text-align: center;
    color: var(--fg);
  }

  .page-title h1 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .page-title p {
    font-size: 14px;
    color: var(--neutral-400);
  }

  .phones-row {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .phone-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .phone-label {
    font-size: 12px;
    color: var(--neutral-500);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .phone-frame {
    width: 320px;
    height: 690px;
    background: var(--bg);
    border-radius: 44px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 30px 60px -15px rgba(0,0,0,0.7);
  }

  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 26px;
    background: #000;
    border-radius: 0 0 16px 16px;
    z-index: 10;
  }

  .onboarding-screen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 60px 28px 36px;
    position: relative;
  }

  .onboarding-screen::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 50%;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,92,38,0.1) 0%, transparent 70%);
    pointer-events: none;
  }

  .skip-btn {
    align-self: flex-end;
    font-size: 14px;
    color: var(--neutral-400);
    font-weight: 500;
    padding: 6px 4px;
    cursor: pointer;
    position: relative;
    z-index: 2;
  }

  .illustration {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .illus-ring {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 28px solid var(--primary-500);
    position: relative;
  }

  .illus-ring::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--primary-400);
    box-shadow: 0 0 30px rgba(255,92,38,0.5);
  }

  .illus-check {
    position: absolute;
    bottom: 20px;
    right: 10px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--success-500);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(16,185,129,0.4);
  }

  .illus-check svg {
    width: 24px;
    height: 24px;
    stroke: white;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .illus-bolt {
    position: absolute;
    top: 30px;
    right: 30px;
    width: 40px;
    height: 40px;
    color: var(--primary-500);
  }

  .illus-bolt svg {
    width: 100%;
    height: 100%;
    fill: currentColor;
  }

  /* Screen 2: AI planning */
  .illus-calendar {
    width: 180px;
    height: 180px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid rgba(255,255,255,0.06);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
  }

  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--neutral-400);
    font-weight: 600;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    flex: 1;
  }

  .cal-dot {
    border-radius: 4px;
    background: rgba(255,255,255,0.05);
  }

  .cal-dot.active {
    background: var(--primary-500);
    box-shadow: 0 0 8px rgba(255,92,38,0.4);
  }

  .cal-dot.today {
    background: var(--primary-500);
    border: 2px solid var(--primary-300);
  }

  .ai-badge {
    position: absolute;
    top: -10px;
    right: -10px;
    background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: var(--radius-full);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Screen 3: Progress */
  .illus-chart {
    width: 200px;
    height: 160px;
    position: relative;
  }

  .chart-bars {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    height: 100%;
    padding-bottom: 24px;
  }

  .chart-bar {
    flex: 1;
    background: linear-gradient(to top, var(--primary-700), var(--primary-400));
    border-radius: 4px 4px 0 0;
    min-height: 20px;
  }

  .chart-bar:nth-child(1) { height: 30%; }
  .chart-bar:nth-child(2) { height: 45%; }
  .chart-bar:nth-child(3) { height: 40%; }
  .chart-bar:nth-child(4) { height: 60%; }
  .chart-bar:nth-child(5) { height: 55%; }
  .chart-bar:nth-child(6) { height: 75%; }
  .chart-bar:nth-child(7) { height: 90%;
    background: linear-gradient(to top, var(--primary-600), var(--primary-300));
    box-shadow: 0 0 12px rgba(255,92,38,0.3);
  }

  .chart-label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: var(--neutral-400);
  }

  .trend-up {
    position: absolute;
    top: 0;
    right: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--success-500);
    font-size: 13px;
    font-weight: 700;
    font-family: var(--font-display);
  }

  .trend-up svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .onboarding-text {
    position: relative;
    z-index: 2;
  }

  .onboarding-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--fg);
    margin-bottom: 10px;
    line-height: 1.3;
  }

  .onboarding-desc {
    font-size: 14px;
    color: var(--neutral-400);
    line-height: 1.6;
  }

  .onboarding-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 28px;
    position: relative;
    z-index: 2;
  }

  .page-indicator {
    display: flex;
    gap: 8px;
  }

  .indicator-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--neutral-700);
    transition: all 0.3s ease;
  }

  .indicator-dot.active {
    width: 24px;
    border-radius: 4px;
    background: var(--primary-500);
  }

  .next-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,92,38,0.35);
    transition: transform 0.2s ease;
  }

  .next-btn svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .start-btn {
    width: 100%;
    height: 52px;
    border-radius: var(--radius-full);
    background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
    color: white;
    font-size: 16px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,92,38,0.35);
    font-family: var(--font-body);
  }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 4px;
    background: var(--fg);
    border-radius: 2px;
    opacity: 0.8;
  }
</style>
</head>
<body>
  <div class="page-title">
    <h1>ONBOARDING</h1>
    <p>引导页 · 3 屏核心卖点</p>
  </div>

  <div class="phones-row">
    <!-- Screen 1: One Tap Record -->
    <div class="phone-wrap">
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="onboarding-screen">
          <div class="skip-btn">跳过</div>
          <div class="illustration">
            <div class="illus-ring">
              <div class="illus-check">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
              <div class="illus-bolt">
                <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
              </div>
            </div>
          </div>
          <div class="onboarding-text">
            <div class="onboarding-title">一次点击<br>记录一组</div>
            <div class="onboarding-desc">不用选动作、不用填重量，打开就能记。把记录成本压到最低，专注训练本身。</div>
          </div>
          <div class="onboarding-footer">
            <div class="page-indicator">
              <div class="indicator-dot active"></div>
              <div class="indicator-dot"></div>
              <div class="indicator-dot"></div>
            </div>
            <div class="next-btn">
              <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
        </div>
        <div class="home-indicator"></div>
      </div>
      <div class="phone-label">01 · 一键记录</div>
    </div>

    <!-- Screen 2: Smart Plan -->
    <div class="phone-wrap">
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="onboarding-screen">
          <div class="skip-btn">跳过</div>
          <div class="illustration">
            <div class="illus-calendar">
              <div class="ai-badge">AI</div>
              <div class="cal-header">
                <span>本周计划</span>
                <span style="color: var(--primary-400);">4 练</span>
              </div>
              <div class="cal-grid">
                <div class="cal-dot active"></div>
                <div class="cal-dot active"></div>
                <div class="cal-dot"></div>
                <div class="cal-dot active"></div>
                <div class="cal-dot"></div>
                <div class="cal-dot today"></div>
                <div class="cal-dot"></div>
                <div class="cal-dot"></div>
                <div class="cal-dot active"></div>
                <div class="cal-dot active"></div>
                <div class="cal-dot"></div>
                <div class="cal-dot active"></div>
                <div class="cal-dot"></div>
                <div class="cal-dot"></div>
              </div>
            </div>
          </div>
          <div class="onboarding-text">
            <div class="onboarding-title">今天练什么<br>不用你想</div>
            <div class="onboarding-desc">根据你的训练历史和进度，自动生成下一阶段计划。双重渐进，科学加量。</div>
          </div>
          <div class="onboarding-footer">
            <div class="page-indicator">
              <div class="indicator-dot"></div>
              <div class="indicator-dot active"></div>
              <div class="indicator-dot"></div>
            </div>
            <div class="next-btn">
              <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
        </div>
        <div class="home-indicator"></div>
      </div>
      <div class="phone-label">02 · 智能计划</div>
    </div>

    <!-- Screen 3: Progress Tracking -->
    <div class="phone-wrap">
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="onboarding-screen">
          <div class="skip-btn">跳过</div>
          <div class="illustration">
            <div class="illus-chart">
              <div class="trend-up">
                <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                +32%
              </div>
              <div class="chart-bars">
                <div class="chart-bar"></div>
                <div class="chart-bar"></div>
                <div class="chart-bar"></div>
                <div class="chart-bar"></div>
                <div class="chart-bar"></div>
                <div class="chart-bar"></div>
                <div class="chart-bar"></div>
              </div>
              <div class="chart-label">过去 7 周</div>
            </div>
          </div>
          <div class="onboarding-text">
            <div class="onboarding-title">看得见的进步<br>才是动力</div>
            <div class="onboarding-desc">自动追踪力量、体重、围度变化。数据不会说谎，每一次进步都被记录。</div>
          </div>
          <div class="onboarding-footer" style="margin-top: 20px;">
            <button class="start-btn">开始训练</button>
          </div>
        </div>
        <div class="home-indicator"></div>
      </div>
      <div class="phone-label">03 · 数据可视化</div>
    </div>
  </div>
</body>
</html>
