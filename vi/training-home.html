<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练了么 · 训练首页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary-50: #FFF3EE;
    --primary-300: #FF9E7C;
    --primary-400: #FF7D50;
    --primary-500: #FF5C26;
    --primary-600: #E04A18;
    --primary-700: #B83810;
    --neutral-50: #F5F3F1;
    --neutral-400: #8A8176;
    --neutral-500: #6B6157;
    --neutral-700: #38322C;
    --neutral-800: #24201C;
    --neutral-900: #141210;
    --bg: #0E0C0A;
    --surface: #1A1714;
    --surface-2: #24201C;
    --fg: #F5F3F1;
    --success-500: #10B981;
    --success-400: #34D399;
    --warning-500: #F59E0B;
    --warning-400: #FBBF24;
    --info-400: #22D3EE;
    --purple-400: #A78BFA;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --radius-full: 9999px;
    --font-display: 'Oswald', 'Noto Sans SC', sans-serif;
    --font-body: 'Noto Sans SC', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  body {
    background: #0a0908;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 60px 20px 40px;
    font-family: var(--font-body);
    gap: 48px;
  }

  .page-title {
    text-align: center;
    color: var(--fg);
  }

  .page-title h1 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .page-title p {
    font-size: 14px;
    color: var(--neutral-400);
  }

  .phone-frame {
    width: 375px;
    height: 812px;
    background: var(--bg);
    border-radius: 48px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 40px 80px -20px rgba(0,0,0,0.8);
    flex-shrink: 0;
  }

  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 30px;
    background: #000;
    border-radius: 0 0 20px 20px;
    z-index: 10;
  }

  .status-bar {
    position: absolute;
    top: 12px;
    left: 0;
    right: 0;
    height: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 32px;
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    z-index: 5;
  }

  .screen-body {
    height: 100%;
    overflow-y: auto;
    padding-bottom: 100px;
  }

  .home-header {
    padding: 52px 20px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, rgba(255,92,38,0.08) 0%, transparent 100%);
  }

  .greeting {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .greeting .hello {
    font-size: 13px;
    color: var(--neutral-400);
  }

  .greeting .name {
    font-size: 20px;
    font-weight: 700;
    color: var(--fg);
  }

  .header-actions {
    display: flex;
    gap: 10px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg);
    cursor: pointer;
    position: relative;
  }

  .icon-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .badge-dot {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary-500);
    border: 2px solid var(--bg);
  }

  .streak-bar {
    margin: 8px 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: linear-gradient(135deg, rgba(255,92,38,0.12), rgba(255,92,38,0.04));
    border: 1px solid rgba(255,92,38,0.2);
    border-radius: var(--radius-lg);
  }

  .fire-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    flex-shrink: 0;
  }

  .fire-icon svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .streak-text {
    flex: 1;
  }

  .streak-text .main {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 2px;
  }

  .streak-text .sub {
    font-size: 12px;
    color: var(--neutral-400);
  }

  .streak-num {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    color: var(--primary-400);
    line-height: 1;
    text-align: center;
  }

  .streak-num span {
    display: block;
    font-size: 10px;
    color: var(--neutral-400);
    font-weight: 400;
    font-family: var(--font-body);
    margin-top: 2px;
    letter-spacing: 0;
  }

  .today-workout {
    margin: 0 16px 20px;
    background: linear-gradient(135deg, var(--primary-600) 0%, var(--primary-800) 100%);
    border-radius: var(--radius-xl);
    padding: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(255,92,38,0.25);
  }

  .today-workout::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -40px;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 24px solid rgba(255,255,255,0.08);
  }

  .today-label {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    font-weight: 500;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .today-name {
    font-size: 24px;
    font-weight: 700;
    color: white;
    margin-bottom: 8px;
    position: relative;
  }

  .today-meta {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: rgba(255,255,255,0.75);
    margin-bottom: 18px;
    position: relative;
  }

  .today-meta span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .today-meta svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .start-workout-btn {
    width: 100%;
    height: 48px;
    border-radius: var(--radius-full);
    background: white;
    color: var(--primary-600);
    font-size: 15px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    position: relative;
  }

  .start-workout-btn svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  .quick-actions {
    padding: 0 16px 20px;
  }

  .section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .section-title h3 {
    font-size: 15px;
    font-weight: 600;
    color: var(--fg);
  }

  .section-title a {
    font-size: 12px;
    color: var(--neutral-400);
    text-decoration: none;
  }

  .quick-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .quick-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 6px;
    background: var(--surface);
    border-radius: var(--radius-md);
    border: 1px solid rgba(255,255,255,0.04);
    cursor: pointer;
  }

  .quick-icon {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .quick-icon svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .quick-icon.q1 { background: rgba(255,92,38,0.12); color: var(--primary-400); }
  .quick-icon.q2 { background: rgba(16,185,129,0.12); color: var(--success-500); }
  .quick-icon.q3 { background: rgba(34,211,238,0.12); color: var(--info-400); }
  .quick-icon.q4 { background: rgba(167,139,250,0.12); color: var(--purple-400); }

  .quick-name {
    font-size: 11px;
    color: var(--neutral-300);
    font-weight: 500;
    text-align: center;
  }

  .recent-section {
    padding: 0 16px 16px;
  }

  .recent-item {
    display: flex;
    gap: 12px;
    padding: 14px;
    background: var(--surface);
    border-radius: var(--radius-md);
    border: 1px solid rgba(255,255,255,0.04);
    margin-bottom: 8px;
  }

  .recent-icon {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .recent-icon svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .recent-icon.chest { background: rgba(255,92,38,0.15); color: var(--primary-400); }
  .recent-icon.back { background: rgba(99,102,241,0.15); color: #818CF8; }
  .recent-icon.leg { background: rgba(16,185,129,0.15); color: var(--success-400); }

  .recent-info {
    flex: 1;
    min-width: 0;
  }

  .recent-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 4px;
  }

  .recent-detail {
    font-size: 12px;
    color: var(--neutral-400);
    display: flex;
    gap: 10px;
  }

  .recent-detail span {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .recent-date {
    font-size: 11px;
    color: var(--neutral-500);
    flex-shrink: 0;
  }

  .tab-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(20, 18, 16, 0.92);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 8px 4px 24px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 10;
  }

  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--neutral-500);
    flex: 1;
  }

  .tab-item svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .tab-item span {
    font-size: 10px;
    font-weight: 500;
  }

  .tab-item.active {
    color: var(--primary-500);
  }

  .tab-item.active svg {
    fill: rgba(255, 92, 38, 0.12);
  }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: var(--fg);
    border-radius: 3px;
    opacity: 0.9;
    z-index: 20;
  }
</style>
</head>
<body>
  <div class="page-title">
    <h1>TRAINING HOME</h1>
    <p>训练首页</p>
  </div>

  <div class="phone-frame">
    <div class="notch"></div>
    <div class="status-bar">
      <span>9:41</span>
      <span style="font-size:12px;opacity:0.8">100%</span>
    </div>
    <div class="screen-body">
      <div class="home-header">
        <div class="greeting">
          <span class="hello">下午好 👋</span>
          <span class="name">练了么用户</span>
        </div>
        <div class="header-actions">
          <div class="icon-btn">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </div>
          <div class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="badge-dot"></span>
          </div>
        </div>
      </div>

      <!-- Streak -->
      <div class="streak-bar">
        <div class="fire-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2s4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 1-3s-1 5 3 5 3-3 3-5c0-2-3-5-3-5z"/><path d="M12 22a5 5 0 0 0 5-5h-2a3 3 0 0 1-6 0H7a5 5 0 0 0 5 5z"/></svg>
        </div>
        <div class="streak-text">
          <div class="main">已连续打卡 23 天</div>
          <div class="sub">再坚持 7 天解锁「月度铁人」</div>
        </div>
        <div class="streak-num">
          23
          <span>连续天数</span>
        </div>
      </div>

      <!-- Today's workout hero -->
      <div class="today-workout">
        <div class="today-label">今日训练 · DAY 23</div>
        <div class="today-name">胸 + 三头训练</div>
        <div class="today-meta">
          <span>
            <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>
            8 个动作
          </span>
          <span>
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            约 45 分钟
          </span>
        </div>
        <button class="start-workout-btn">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          开始训练
        </button>
      </div>

      <!-- Quick actions -->
      <div class="quick-actions">
        <div class="section-title">
          <h3>快速入口</h3>
        </div>
        <div class="quick-grid">
          <div class="quick-item">
            <div class="quick-icon q1">
              <svg viewBox="0 0 24 24"><path d="M2 12h2M20 12h2M6 8v8M18 8v8M6 12h12"/></svg>
            </div>
            <span class="quick-name">自由训练</span>
          </div>
          <div class="quick-item">
            <div class="quick-icon q2">
              <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
            </div>
            <span class="quick-name">动作库</span>
          </div>
          <div class="quick-item">
            <div class="quick-icon q3">
              <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
            </div>
            <span class="quick-name">训练计划</span>
          </div>
          <div class="quick-item">
            <div class="quick-icon q4">
              <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8 5.8 21.3l2.4-7.4L2 9.4h7.6z"/></svg>
            </div>
            <span class="quick-name">成就</span>
          </div>
        </div>
      </div>

      <!-- Recent workouts -->
      <div class="recent-section">
        <div class="section-title">
          <h3>最近训练</h3>
          <a href="#">查看全部 ›</a>
        </div>
        <div class="recent-item">
          <div class="recent-icon chest">
            <svg viewBox="0 0 24 24"><path d="M2 12h2M20 12h2M6 8v8M18 8v8M6 12h12"/></svg>
          </div>
          <div class="recent-info">
            <div class="recent-name">胸 + 三头训练</div>
            <div class="recent-detail">
              <span>8 动作</span>
              <span>·</span>
              <span>42 分钟</span>
              <span>·</span>
              <span>320kg 总容量</span>
            </div>
          </div>
          <span class="recent-date">今天</span>
        </div>
        <div class="recent-item">
          <div class="recent-icon back">
            <svg viewBox="0 0 24 24"><path d="M12 3v18M5 8l7-5 7 5M5 16l7 5 7-5"/></svg>
          </div>
          <div class="recent-info">
            <div class="recent-name">背 + 二头训练</div>
            <div class="recent-detail">
              <span>7 动作</span>
              <span>·</span>
              <span>38 分钟</span>
              <span>·</span>
              <span>280kg 总容量</span>
            </div>
          </div>
          <span class="recent-date">昨天</span>
        </div>
        <div class="recent-item">
          <div class="recent-icon leg">
            <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
          </div>
          <div class="recent-info">
            <div class="recent-name">腿部训练</div>
            <div class="recent-detail">
              <span>6 动作</span>
              <span>·</span>
              <span>50 分钟</span>
              <span>·</span>
              <span>450kg 总容量</span>
            </div>
          </div>
          <span class="recent-date">2 天前</span>
        </div>
      </div>
    </div>

    <div class="tab-bar">
      <div class="tab-item active">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>
        <span>训练</span>
      </div>
      <div class="tab-item">
        <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
        <span>进步</span>
      </div>
      <div class="tab-item">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/></svg>
        <span>数据</span>
      </div>
      <div class="tab-item">
        <svg viewBox="0 0 24 24"><path d="M8 6h8M8 12h8M8 18h5"/><rect x="4" y="3" width="16" height="18" rx="2"/></svg>
        <span>计划</span>
      </div>
      <div class="tab-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        <span>我的</span>
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
