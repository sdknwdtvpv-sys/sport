<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练了么 · 登录注册</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary-50: #FFF3EE;
    --primary-300: #FF9E7C;
    --primary-400: #FF7D50;
    --primary-500: #FF5C26;
    --primary-600: #E04A18;
    --primary-700: #B83810;
    --primary-800: #8F2A0C;
    --neutral-50: #F5F3F1;
    --neutral-300: #ABA49A;
    --neutral-400: #8A8176;
    --neutral-500: #6B6157;
    --neutral-700: #38322C;
    --neutral-800: #24201C;
    --neutral-900: #141210;
    --bg: #0E0C0A;
    --surface: #1A1714;
    --surface-2: #24201C;
    --fg: #F5F3F1;
    --success-500: #10B981;
    --info-400: #22D3EE;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-full: 9999px;
    --font-display: 'Oswald', 'Noto Sans SC', sans-serif;
    --font-body: 'Noto Sans SC', sans-serif;
  }

  body {
    background: #0a0908;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 60px 20px 40px;
    font-family: var(--font-body);
    gap: 48px;
  }

  .page-title {
    text-align: center;
    color: var(--fg);
  }

  .page-title h1 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .page-title p {
    font-size: 14px;
    color: var(--neutral-400);
  }

  .phones-row {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .phone-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .phone-label {
    font-size: 12px;
    color: var(--neutral-500);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .phone-frame {
    width: 340px;
    height: 730px;
    background: var(--bg);
    border-radius: 44px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 40px 80px -20px rgba(0,0,0,0.8);
  }

  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 26px;
    background: #000;
    border-radius: 0 0 16px 16px;
    z-index: 10;
  }

  .status-bar {
    position: absolute;
    top: 12px;
    left: 0;
    right: 0;
    height: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 28px;
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    z-index: 5;
  }

  .auth-screen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 52px 28px 32px;
    position: relative;
  }

  .auth-screen::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 250px;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,92,38,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .auth-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 40px;
    margin-top: 20px;
    position: relative;
    z-index: 1;
  }

  .brand-ring {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 12px solid var(--primary-500);
    position: relative;
    margin-bottom: 16px;
    filter: drop-shadow(0 4px 12px rgba(255,92,38,0.3));
  }

  .brand-ring::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary-400);
  }

  .auth-brand h1 {
    font-size: 24px;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: 2px;
  }

  .auth-brand .slogan {
    font-size: 13px;
    color: var(--neutral-400);
    margin-top: 4px;
  }

  .auth-tabs {
    display: flex;
    background: var(--surface);
    border-radius: var(--radius-full);
    padding: 4px;
    margin-bottom: 28px;
    position: relative;
    z-index: 1;
  }

  .auth-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    color: var(--neutral-400);
    border-radius: var(--radius-full);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .auth-tab.active {
    background: var(--primary-500);
    color: white;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(255,92,38,0.3);
  }

  .auth-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
    z-index: 1;
    flex: 1;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-label {
    font-size: 13px;
    color: var(--neutral-400);
    font-weight: 500;
    padding-left: 4px;
  }

  .form-input {
    height: 48px;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-md);
    padding: 0 16px;
    font-size: 15px;
    color: var(--fg);
    font-family: var(--font-body);
    transition: all 0.2s ease;
    outline: none;
  }

  .form-input:focus {
    border-color: var(--primary-500);
    box-shadow: 0 0 0 3px rgba(255,92,38,0.15);
  }

  .form-input::placeholder {
    color: var(--neutral-500);
  }

  .input-with-icon {
    position: relative;
  }

  .input-with-icon .form-input {
    width: 100%;
    padding-right: 90px;
  }

  .code-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    height: 34px;
    padding: 0 14px;
    border-radius: var(--radius-sm);
    background: rgba(255,92,38,0.12);
    color: var(--primary-400);
    font-size: 12px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    font-family: var(--font-body);
  }

  .forgot-row {
    display: flex;
    justify-content: flex-end;
  }

  .forgot-link {
    font-size: 13px;
    color: var(--primary-400);
    text-decoration: none;
    font-weight: 500;
  }

  .primary-btn {
    width: 100%;
    height: 52px;
    border-radius: var(--radius-full);
    background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
    color: white;
    font-size: 16px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    font-family: var(--font-body);
    box-shadow: 0 8px 24px rgba(255,92,38,0.35);
    margin-top: 8px;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.08);
  }

  .divider-text {
    font-size: 12px;
    color: var(--neutral-500);
  }

  .social-login {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 24px;
  }

  .social-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--fg);
  }

  .social-btn svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
  }

  .auth-footer {
    margin-top: auto;
    text-align: center;
    font-size: 13px;
    color: var(--neutral-400);
  }

  .auth-footer a {
    color: var(--primary-400);
    text-decoration: none;
    font-weight: 500;
  }

  .agreement {
    font-size: 11px;
    color: var(--neutral-500);
    text-align: center;
    line-height: 1.6;
    margin-bottom: 12px;
  }

  .agreement a {
    color: var(--neutral-400);
  }

  .agreement .highlight {
    color: var(--primary-400);
  }

  /* Onboarding setup screen */
  .setup-screen .step-indicator {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 32px;
  }

  .step-dot {
    width: 24px;
    height: 4px;
    border-radius: 2px;
    background: var(--neutral-700);
  }

  .step-dot.active {
    background: var(--primary-500);
    width: 32px;
  }

  .setup-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--fg);
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .setup-sub {
    font-size: 14px;
    color: var(--neutral-400);
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .option-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .option-item.selected {
    border-color: var(--primary-500);
    background: rgba(255,92,38,0.08);
  }

  .option-icon {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-sm);
    background: rgba(255,92,38,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-400);
    flex-shrink: 0;
  }

  .option-icon svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .option-text {
    flex: 1;
  }

  .option-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 2px;
  }

  .option-desc {
    font-size: 12px;
    color: var(--neutral-400);
  }

  .option-check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--neutral-500);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .option-item.selected .option-check {
    background: var(--primary-500);
    border-color: var(--primary-500);
  }

  .option-check svg {
    width: 12px;
    height: 12px;
    stroke: white;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .setup-nav {
    margin-top: auto;
    display: flex;
    gap: 12px;
  }

  .btn-outline {
    flex: 1;
    height: 48px;
    border-radius: var(--radius-full);
    background: transparent;
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--fg);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font-body);
  }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 4px;
    background: var(--fg);
    border-radius: 2px;
    opacity: 0.8;
  }
</style>
</head>
<body>
  <div class="page-title">
    <h1>AUTH & ONBOARDING</h1>
    <p>登录注册 · 初始设置</p>
  </div>

  <div class="phones-row">
    <!-- Login screen -->
    <div class="phone-wrap">
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="status-bar">
          <span>9:41</span>
          <span style="font-size:12px;opacity:0.8">100%</span>
        </div>
        <div class="auth-screen">
          <div class="auth-brand">
            <div class="brand-ring"></div>
            <h1>练了么</h1>
            <div class="slogan">一次点击，记录一组</div>
          </div>

          <div class="auth-tabs">
            <div class="auth-tab active">登录</div>
            <div class="auth-tab">注册</div>
          </div>

          <div class="auth-form">
            <div class="form-group">
              <label class="form-label">手机号</label>
              <input type="tel" class="form-input" placeholder="请输入手机号">
            </div>

            <div class="form-group">
              <label class="form-label">验证码</label>
              <div class="input-with-icon">
                <input type="text" class="form-input" placeholder="请输入验证码">
                <button class="code-btn">获取验证码</button>
              </div>
            </div>

            <div class="forgot-row">
              <a href="#" class="forgot-link">遇到问题？</a>
            </div>

            <button class="primary-btn">登录</button>

            <div class="divider">
              <div class="divider-line"></div>
              <span class="divider-text">其他登录方式</span>
              <div class="divider-line"></div>
            </div>

            <div class="social-login">
              <div class="social-btn">
                <svg viewBox="0 0 24 24"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18z"/></svg>
              </div>
              <div class="social-btn">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.28-.02-.12.02-1.96 1.25-5.54 3.66-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.37-.49 1.02-.74 3.98-1.73 6.64-2.87 7.97-3.43 3.8-1.6 4.59-1.88 5.1-1.89.11 0 .37.03.53.17.14.12.18.28.2.45-.01.06.01.24 0 .38z"/></svg>
              </div>
              <div class="social-btn">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
              </div>
            </div>
          </div>

          <div class="auth-footer">
            <div class="agreement">
              登录即表示同意<span class="highlight">《用户协议》</span><br>
              和<span class="highlight">《隐私政策》</span>
            </div>
            还没有账号？<a href="#">立即注册</a>
          </div>
        </div>
        <div class="home-indicator"></div>
      </div>
      <div class="phone-label">登录 / 注册</div>
    </div>

    <!-- Goal setup screen -->
    <div class="phone-wrap">
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="status-bar">
          <span>9:41</span>
          <span style="font-size:12px;opacity:0.8">100%</span>
        </div>
        <div class="auth-screen setup-screen">
          <div class="step-indicator">
            <div class="step-dot active"></div>
            <div class="step-dot active"></div>
            <div class="step-dot"></div>
            <div class="step-dot"></div>
          </div>

          <div class="setup-title">你的训练目标是？</div>
          <div class="setup-sub">选择一个主要目标，我们会为你定制训练计划。</div>

          <div class="option-list">
            <div class="option-item selected">
              <div class="option-icon">
                <svg viewBox="0 0 24 24"><path d="M2 12h2M20 12h2M6 8v8M18 8v8M6 12h12"/></svg>
              </div>
              <div class="option-text">
                <div class="option-title">增肌</div>
                <div class="option-desc">增加肌肉量，变得更强壮</div>
              </div>
              <div class="option-check">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
            </div>
            <div class="option-item">
              <div class="option-icon" style="background: rgba(16,185,129,0.12); color: var(--success-500);">
                <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
              </div>
              <div class="option-text">
                <div class="option-title">减脂</div>
                <div class="option-desc">降低体脂率，保持肌肉</div>
              </div>
              <div class="option-check"></div>
            </div>
            <div class="option-item">
              <div class="option-icon" style="background: rgba(34,211,238,0.12); color: var(--info-400);">
                <svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg>
              </div>
              <div class="option-text">
                <div class="option-title">力量提升</div>
                <div class="option-desc">专注三大项力量突破</div>
              </div>
              <div class="option-check"></div>
            </div>
            <div class="option-item">
              <div class="option-icon" style="background: rgba(167,139,250,0.12); color: #A78BFA;">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              </div>
              <div class="option-text">
                <div class="option-title">保持健康</div>
                <div class="option-desc">规律运动，维持状态</div>
              </div>
              <div class="option-check"></div>
            </div>
          </div>

          <div class="setup-nav">
            <button class="btn-outline">上一步</button>
            <button class="primary-btn" style="flex:2; margin:0;">下一步</button>
          </div>
        </div>
        <div class="home-indicator"></div>
      </div>
      <div class="phone-label">目标设置</div>
    </div>
  </div>
</body>
</html>
