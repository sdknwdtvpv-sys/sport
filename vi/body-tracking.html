<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练了么 · 身体数据记录页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary-50: #FFF3EE;
    --primary-300: #FF9E7C;
    --primary-400: #FF7D50;
    --primary-500: #FF5C26;
    --primary-600: #E04A18;
    --primary-700: #B83810;
    --neutral-50: #F5F3F1;
    --neutral-200: #D1CCC5;
    --neutral-300: #ABA49A;
    --neutral-400: #8A8176;
    --neutral-500: #6B6157;
    --neutral-700: #38322C;
    --neutral-800: #24201C;
    --neutral-900: #141210;
    --bg: #0E0C0A;
    --surface: #1A1714;
    --surface-2: #24201C;
    --fg: #F5F3F1;
    --success-500: #10B981;
    --success-400: #34D399;
    --warning-500: #F59E0B;
    --error-500: #EF4444;
    --info-400: #22D3EE;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-full: 9999px;
    --font-display: 'Oswald', 'Noto Sans SC', sans-serif;
    --font-body: 'Noto Sans SC', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  body {
    background: #0a0908;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 60px 20px 40px;
    font-family: var(--font-body);
    gap: 48px;
  }

  .page-title {
    text-align: center;
    color: var(--fg);
  }

  .page-title h1 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .page-title p {
    font-size: 14px;
    color: var(--neutral-400);
  }

  .phone-frame {
    width: 375px;
    height: 812px;
    background: var(--bg);
    border-radius: 48px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 40px 80px -20px rgba(0,0,0,0.8);
    flex-shrink: 0;
  }

  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 30px;
    background: #000;
    border-radius: 0 0 20px 20px;
    z-index: 10;
  }

  .status-bar {
    position: absolute;
    top: 12px;
    left: 0;
    right: 0;
    height: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 32px;
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    z-index: 5;
  }

  .screen-body {
    padding: 56px 20px 100px;
    height: 100%;
    overflow-y: auto;
  }

  .screen-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .screen-header h2 {
    font-size: 22px;
    font-weight: 700;
    color: var(--fg);
  }

  .add-btn {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-full);
    background: var(--primary-500);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    cursor: pointer;
  }

  .add-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
  }

  .weight-card {
    background: linear-gradient(135deg, var(--surface-2) 0%, var(--surface) 100%);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }

  .weight-card::before {
    content: '';
    position: absolute;
    top: -40px;
    right: -40px;
    width: 140px;
    height: 140px;
    background: radial-gradient(circle, rgba(255,92,38,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .card-label {
    font-size: 13px;
    color: var(--neutral-400);
    margin-bottom: 8px;
    font-weight: 500;
  }

  .weight-main {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .weight-value {
    font-family: var(--font-display);
    font-size: 42px;
    font-weight: 700;
    color: var(--fg);
    line-height: 1;
    letter-spacing: -1px;
  }

  .weight-unit {
    font-size: 16px;
    color: var(--neutral-400);
    font-weight: 500;
  }

  .weight-change {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: var(--radius-full);
    background: rgba(16, 185, 129, 0.12);
    color: var(--success-500);
  }

  .weight-change svg {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .chart-container {
    margin-top: 16px;
    height: 120px;
    position: relative;
  }

  .chart-grid {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .chart-grid-line {
    height: 1px;
    background: rgba(255,255,255,0.04);
  }

  .chart-line {
    position: absolute;
    bottom: 10px;
    left: 0;
    right: 0;
    height: 80px;
  }

  .chart-line svg {
    width: 100%;
    height: 100%;
  }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .metric-card {
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 16px;
    border: 1px solid rgba(255,255,255,0.04);
  }

  .metric-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 6px;
  }

  .metric-icon {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    background: rgba(255,92,38,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-400);
  }

  .metric-icon svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .metric-change {
    font-size: 11px;
    font-weight: 600;
    color: var(--success-500);
  }

  .metric-change.up { color: var(--success-500); }
  .metric-change.down { color: var(--primary-400); }

  .metric-value {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 700;
    color: var(--fg);
    line-height: 1;
    margin-bottom: 2px;
  }

  .metric-label {
    font-size: 12px;
    color: var(--neutral-400);
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .section-header h3 {
    font-size: 16px;
    font-weight: 600;
    color: var(--fg);
  }

  .section-header a {
    font-size: 13px;
    color: var(--primary-400);
    text-decoration: none;
    font-weight: 500;
  }

  .history-list {
    background: var(--surface);
    border-radius: var(--radius-md);
    border: 1px solid rgba(255,255,255,0.04);
    overflow: hidden;
  }

  .history-item {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .history-item:last-child {
    border-bottom: none;
  }

  .history-date {
    font-size: 13px;
    color: var(--neutral-400);
    width: 80px;
    flex-shrink: 0;
  }

  .history-metrics {
    flex: 1;
    display: flex;
    gap: 20px;
  }

  .history-metric {
    font-size: 14px;
    color: var(--fg);
    font-family: var(--font-mono);
    font-weight: 500;
  }

  .history-metric span {
    font-size: 11px;
    color: var(--neutral-500);
    font-family: var(--font-body);
    margin-left: 2px;
  }

  .history-delta {
    font-size: 12px;
    font-weight: 600;
    color: var(--success-500);
  }

  .tab-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(20, 18, 16, 0.92);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 8px 4px 24px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 10;
  }

  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--neutral-500);
    flex: 1;
  }

  .tab-item svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .tab-item span {
    font-size: 10px;
    font-weight: 500;
  }

  .tab-item.active {
    color: var(--primary-500);
  }

  .tab-item.active svg {
    fill: rgba(255, 92, 38, 0.12);
  }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: var(--fg);
    border-radius: 3px;
    opacity: 0.9;
    z-index: 20;
  }
</style>
</head>
<body>
  <div class="page-title">
    <h1>BODY TRACKING</h1>
    <p>身体数据记录页</p>
  </div>

  <div class="phone-frame">
    <div class="notch"></div>
    <div class="status-bar">
      <span>9:41</span>
      <span style="font-size:12px;opacity:0.8">100%</span>
    </div>
    <div class="screen-body">
      <div class="screen-header">
        <h2>身体数据</h2>
        <div class="add-btn">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
      </div>

      <!-- Weight main card -->
      <div class="weight-card">
        <div class="card-label">当前体重</div>
        <div class="weight-main">
          <div class="weight-value">72.5</div>
          <div class="weight-unit">kg</div>
        </div>
        <div class="weight-change">
          <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
          -1.2 kg 本周
        </div>
        <div class="chart-container">
          <div class="chart-grid">
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
          </div>
          <div class="chart-line">
            <svg viewBox="0 0 300 80" preserveAspectRatio="none">
              <defs>
                <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" style="stop-color:#FF5C26;stop-opacity:0.3"/>
                  <stop offset="100%" style="stop-color:#FF5C26;stop-opacity:0"/>
                </linearGradient>
              </defs>
              <path d="M0,60 L30,55 L60,58 L90,50 L120,48 L150,42 L180,45 L210,38 L240,35 L270,30 L300,25 L300,80 L0,80 Z" fill="url(#lineGrad)"/>
              <path d="M0,60 L30,55 L60,58 L90,50 L120,48 L150,42 L180,45 L210,38 L240,35 L270,30 L300,25" fill="none" stroke="#FF5C26" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="300" cy="25" r="4" fill="#FF5C26"/>
              <circle cx="300" cy="25" r="8" fill="#FF5C26" opacity="0.2"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Metric grid -->
      <div class="metric-grid">
        <div class="metric-card">
          <div class="metric-top">
            <div class="metric-icon">
              <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 5-7"/></svg>
            </div>
            <span class="metric-change down">-2.1%</span>
          </div>
          <div class="metric-value">18.5</div>
          <div class="metric-label">体脂率 %</div>
        </div>
        <div class="metric-card">
          <div class="metric-top">
            <div class="metric-icon" style="background: rgba(16,185,129,0.12); color: var(--success-400);">
              <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </div>
            <span class="metric-change up">+0.8kg</span>
          </div>
          <div class="metric-value">34.2</div>
          <div class="metric-label">肌肉量 kg</div>
        </div>
        <div class="metric-card">
          <div class="metric-top">
            <div class="metric-icon" style="background: rgba(245,158,11,0.12); color: var(--warning-500);">
              <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
            </div>
            <span class="metric-change up">-1.5cm</span>
          </div>
          <div class="metric-value">82</div>
          <div class="metric-label">腰围 cm</div>
        </div>
        <div class="metric-card">
          <div class="metric-top">
            <div class="metric-icon" style="background: rgba(34,211,238,0.12); color: var(--info-400);">
              <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
            </div>
            <span class="metric-change up">+0.3</span>
          </div>
          <div class="metric-value">24.8</div>
          <div class="metric-label">BMI</div>
        </div>
      </div>

      <!-- History -->
      <div class="section-header">
        <h3>最近记录</h3>
        <a href="#">全部</a>
      </div>
      <div class="history-list">
        <div class="history-item">
          <span class="history-date">今天</span>
          <div class="history-metrics">
            <span class="history-metric">72.5<span>kg</span></span>
            <span class="history-metric">18.5<span>%</span></span>
          </div>
          <span class="history-delta">-0.3</span>
        </div>
        <div class="history-item">
          <span class="history-date">昨天</span>
          <div class="history-metrics">
            <span class="history-metric">72.8<span>kg</span></span>
            <span class="history-metric">18.6<span>%</span></span>
          </div>
          <span class="history-delta">-0.2</span>
        </div>
        <div class="history-item">
          <span class="history-date">10/3</span>
          <div class="history-metrics">
            <span class="history-metric">73.0<span>kg</span></span>
            <span class="history-metric">18.7<span>%</span></span>
          </div>
          <span class="history-delta">-0.5</span>
        </div>
        <div class="history-item">
          <span class="history-date">10/1</span>
          <div class="history-metrics">
            <span class="history-metric">73.5<span>kg</span></span>
            <span class="history-metric">18.8<span>%</span></span>
          </div>
          <span class="history-delta">—</span>
        </div>
      </div>
    </div>

    <div class="tab-bar">
      <div class="tab-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>
        <span>训练</span>
      </div>
      <div class="tab-item">
        <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
        <span>进步</span>
      </div>
      <div class="tab-item active">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/></svg>
        <span>数据</span>
      </div>
      <div class="tab-item">
        <svg viewBox="0 0 24 24"><path d="M8 6h8M8 12h8M8 18h5"/><rect x="4" y="3" width="16" height="18" rx="2"/></svg>
        <span>计划</span>
      </div>
      <div class="tab-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        <span>我的</span>
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
