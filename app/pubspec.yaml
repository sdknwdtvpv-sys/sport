name: lianleme
description: 练了么 —— 一次点击记一组的力量训练记录工具
publish_to: 'none'
version: 1.35.1+47

environment:
  sdk: '>=3.5.0 <4.0.0'

# 依赖保持最小：除持久化必需的 drift 外不加任何东西。
#
# ⚠️ 不要加 sqlite3_flutter_libs —— 它已终止维护（最新版号 0.6.0+eol），
#    pub.dev 上的描述明确写着 "Not used anymore, update to version 3.x of package:sqlite3 instead"。
#    原生库现在由 sqlite3 3.x 自己构建，而 drift_flutter 已经传递依赖它。
#    （几乎所有 drift 教程都还在教你加这个包，别照抄。）
#
# 例外记录（上面那句"不加任何东西"的两次有意破例，都是 S7 分享卡）：
#   * share_plus —— 拉起系统分享面板。**不需要任何权限**，
#     所以隐私政策里「只申请 INTERNET 一项权限」那句话仍然成立。
#   * gal —— 存到系统相册。Android 10+ 走 MediaStore 免权限；
#     Android 9 及以下需要 WRITE_EXTERNAL_STORAGE，因此在 AndroidManifest 里
#     声明时带了 `android:maxSdkVersion="29"`，新系统上看不到这条权限。
#     （原来这里写的是 28 —— 2026-09-30 用 aapt2 核打包后的合并 manifest 时改正。）
#
#   为什么不用自写平台通道：那要同时写 Kotlin 与 Swift 两套，
#   而 iOS 那一半在本机**无法验证**（只有 Command Line Tools，没有完整 Xcode）。
#   宁可引入两个可验证的依赖，也不写没跑过的原生代码 —— 详见 share_card.dart。
dependencies:
  flutter:
    sdk: flutter
  # Flutter **官方**的本地化组件（随 SDK 分发，不是第三方库）：没有它，
  # Material 自带的那些页面（「开源许可」页、日期/滚轮选择器）里会是英文 ——
  # 中文 App 里夹一页 "Licenses / VIEW LICENSE" 很突兀（2026-10-01 真机走查）。
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  share_plus: ^13.3.0
  gal: ^2.3.3
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 截图用：真实 App 上跑（MIUI 禁了 adb 输入，但进程内模拟点击不受影响）。
  # 见 integration_test/screenshots_test.dart 与 test_driver/screenshot_driver.dart。
  integration_test:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true
  assets:
    # 由 node seed/build.mjs 生成；唯一真源是 seed/parts/*.json
    - assets/exercises.json
    # 应用内的隐私政策（纯文本）。由 tool/gen-privacy-page.mjs 从 docs/privacy-policy.md
    # **同一份 Markdown** 生成 —— 商店要求应用内能直接读到隐私政策（小米的合规指引：
    # "应用内的隐私政策必须是可以正常打开和查看的状态"，且四步之内能到）。
    # ⚠️ 它和公网那份一样有防漂守卫（gen-privacy-page.mjs --check）。
    - assets/privacy-policy.txt
    # 164 号文要求的「个人信息收集清单 / 与第三方共享个人信息清单」（二级菜单）。
    # 同样是生成物：收集清单 ← docs/privacy-facts.json，共享清单 ← 政策正文的 SDK 表。
    # 生成命令与防漂守卫都在 tool/gen-privacy-page.mjs（--check）。
    - assets/collection-list.txt
