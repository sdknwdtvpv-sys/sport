# 练了么 · 反向代理片段（Nginx）
#
# **给"这台机器上已经跑着别的站"的情况用**：`install.sh` 的 `PROXY_MODE=existing` 会把这个
# 文件（把 __DOMAIN__ / __BACKEND_PORT__ / __COLLECTOR_PORT__ 换成真实值后）打印出来，
# 你把它加进现有的 Nginx 配置里 —— **只加一个 server 块，别动别的站**。
#
# ⚠️ 两条与承诺有关的约定（`tool/check-deploy.mjs` 盯着）：
#   1. **必须显式 `access_log off;`**：隐私政策里写着"不做 IP 记录"。
#      ⚠️ **只"不写 access_log"是不够的** —— 2026-10-04 在真服务器上核出来的：
#      这台机器的 `/etc/nginx/nginx.conf` 在 **http 上下文**里开着
#      `access_log /var/log/nginx/access.log;`，于是**任何新建的 server 块都会继承它**，
#      我们的 /v1 请求照样会把客户端 IP 写进磁盘。
#      所以这里在每个 server/location 里**显式关掉**。想开日志之前，先改政策。
#      （同一个教训你在这台机器上已经解决过一次：`conf.d/beacon-log.conf` 用的是
#       自定义 log_format，刻意去掉 IP 与 UA —— 我们更彻底：这几条路径一律不记。）
#   2. **只 proxy 到 127.0.0.1**：两个服务都只监听本机，
#      8787 / 8790 不对外（也别在防火墙里放开它们）。
#
# ⚠️ **certbot 会再新建一个"80 端口跳转"server 块**（跑 `certbot --nginx --redirect` 时），
#    那是**独立块**，会重新继承 http 层的全局 access_log —— 也就是说：
#    **只在这个文件里关是不够的**。2026-10-04 在真服务器上实测到的：
#      https 那条路没被记 ✓，http（301 之前）那条路一直在记 ✗（日志里带着客户端 IP）。
#    签完证书后**两个块都要有 `access_log off;`**，然后按下面这条验收：
#      # 记下行数 → 发一条 http 请求 → 再看行数，必须一样
#      wc -l < /var/log/nginx/access.log
#      curl -s -o /dev/null http://<你的域名>/healthz
#      wc -l < /var/log/nginx/access.log
#
# 证书：这一段故意**只写 80 端口**，TLS 交给你现有的那一套（certbot / 云厂商证书 / 已有的 443 server 块）。
# 如果你的站已经有 443，把下面 `listen 80;` 那块换成"在你的 443 server 块里加这几个 location"，
# 别新建一个抢 443 的 server 块。

server {
    listen 80;
    server_name __DOMAIN__;

    # ★ 这行不能删：全局 http 块里开着 access_log，不关掉就会记客户端 IP
    access_log off;

    # 埋点收集端：只收 /v1/events（匿名统计，用户主动打开开关才发）
    location /v1/events {
        access_log off;
        proxy_pass http://127.0.0.1:__COLLECTOR_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
    }

    # 备份服务：账号 / 备份 / 删除
    location /v1/ {
        access_log off;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
    }

    # 隐私政策公开页（商店审核会实际打开它，见 docs/release-admin.md §四）。

    # 页面是生成物（store-assets/privacy/），与随包那份同源。

    # URL：`/privacy`（中文）、`/privacy/en`（英文）。

    location = /privacy { return 301 /privacy/; }

    location /privacy/ {

        root __WEB_ROOT__;

        index index.html;

        try_files $uri $uri.html $uri/index.html =404;

        access_log off;

    }


    location = /healthz {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__/healthz;
    }

    # 别的一律不代理（不给自己留一个"顺手加接口"的口子）
    location / {
        return 200 "lianleme";
        add_header Content-Type text/plain;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;
}
