<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=390, initial-scale=1"><title>练了么 · B 整块剧场 · 进步</title><style>
:root{
  --bg:#090706; --surface:#1B1610; --surface-hi:#261F18; --surface-hi2:#2B231B;
  --line:#3B332B; --hair:#28221A; --text:#F7F3ED; --text2:#B6AC9F; --text3:#8D8478;
  --accent:#E2663A; --accent-hi:#F1875C; --accent-lo:#C44E24; --accent-ink:#1A0F0A;
  --accent-text:#F29A72;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;color:var(--text);
}
.stage{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg)}
.sb{height:46px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 7px 28px;color:var(--text);font-size:14px;font-weight:600;letter-spacing:.15px}
.sb-right{display:flex;align-items:center;gap:6px}
.sb svg{display:block}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.content{position:absolute;top:46px;left:var(--pad);right:var(--pad);bottom:0;padding-bottom:96px;display:flex;flex-direction:column}
.a{--pad:32px;--gap:40px;--title:40px}
.b{--pad:28px;--gap:40px;--title:34px}

.head{position:relative;display:flex;align-items:flex-start;gap:12px;flex:0 0 auto}
.head .date{font-size:12px;line-height:16px;color:var(--text3);letter-spacing:.3px;padding-top:4px}
.a .head{flex-direction:column;gap:0}
.a .head .date{order:0;padding-top:0}
.a .h1{font-size:40px;line-height:46px;font-weight:800;letter-spacing:-1px;margin-top:6px;color:var(--text)}
.b .head{flex-direction:column;gap:0}
.b .head .date{order:0;padding-top:0}
.b .h1{font-size:40px;line-height:46px;font-weight:800;letter-spacing:-1px;margin-top:6px;color:var(--text)}
.bell{position:absolute;right:0;top:4px;color:var(--text2)}
.bell svg{width:21px;height:21px}

/* ── A：编辑大字 ───────────────────────────── */
.a .top-rule{height:1px;background:var(--hair);margin-top:24px;flex:0 0 auto}
.a .kicker{font-size:12px;line-height:16px;color:var(--text3);letter-spacing:1.2px;margin-top:var(--gap);font-weight:600}
.a .plan-title{font-size:34px;line-height:40px;font-weight:800;letter-spacing:-.6px;margin-top:6px;color:var(--text)}
.a .plan-meta{font-size:15px;line-height:21px;color:var(--text2);margin-top:8px;letter-spacing:.2px}
.a .plan-meta b{color:var(--text);font-weight:600}
.a .edit{margin-left:auto;color:var(--text3);font-size:12px;display:flex;align-items:center;gap:4px;font-weight:500}
.a .edit svg{width:14px;height:14px}
.a .meta-row{display:flex;align-items:center;margin-top:8px}
.a .list{margin-top:var(--gap);border-top:1px solid var(--hair)}
.a .row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;height:56px}
.a .row .idx{font-size:12px;color:var(--text3)}
.a .row .name{font-size:22px;line-height:28px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.a .row .right{display:flex;align-items:baseline;gap:12px;justify-content:flex-end;min-width:0}
.a .row .sets{font-size:18px;color:var(--text2);text-align:right;white-space:nowrap}
.a .row .wt{font-size:20px;color:var(--text2);text-align:right;white-space:nowrap;font-weight:600}
.a .row .wt i{font-style:normal;font-size:11px;color:var(--text3);margin-left:2px}
.a .cta{width:100%;height:72px;margin-top:var(--gap);border:0;border-radius:999px;background:linear-gradient(180deg,#F08A5B 0%,#E2663A 42%,#D65B2D 100%);color:var(--accent-ink);font-family:inherit;font-size:20px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:10px}
.a .cta svg{width:18px;height:18px}
.a .fact{margin-top:auto;height:52px;display:flex;align-items:center;border-top:1px solid var(--hair);color:var(--text2);font-size:17px;letter-spacing:.2px}
.a .fact .chev{margin-left:auto;width:16px;height:16px;color:var(--text3)}
.a .fact .quiet{color:var(--text3);margin-left:8px;font-size:15px}
.a .period{display:flex;gap:22px;align-items:center;margin-top:var(--gap)}
.a .period b{font-size:15px;color:var(--text3);font-weight:500;position:relative}
.a .period b.on{color:var(--text);font-weight:700}
.a .period b.on::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:2px;border-radius:1px;background:var(--accent)}
.a .hero-label{font-size:12px;color:var(--text3);letter-spacing:1.2px;margin-top:34px;font-weight:600}
.a .metric{font-size:56px;line-height:60px;font-weight:800;letter-spacing:-2px;color:var(--text);margin-top:8px}
.a .metric i{font-style:normal;font-size:18px;font-weight:500;color:var(--text3);letter-spacing:.2px;margin-left:8px}
.a .sub{font-size:15px;color:var(--text3);margin-top:4px}
.a .p-fact{font-size:17px;color:var(--text2);margin-top:20px;letter-spacing:.2px}
.a .p-fact b{color:var(--text);font-weight:600}
.a .chart-wrap{margin-top:34px;margin-left:calc(-1 * var(--pad));margin-right:calc(-1 * var(--pad));height:210px;flex:0 0 auto}
.a .chart-wrap svg{width:390px;height:210px;display:block}
.a .all{margin-top:auto;height:52px;display:flex;align-items:center;border-top:1px solid var(--hair);color:var(--accent-text);font-size:17px;font-weight:600}
.a .all svg{margin-left:auto;width:16px;height:16px;color:var(--text3)}

/* ── B：整块剧场 ───────────────────────────── */
.b .block{
  margin-top:var(--gap);padding:20px;border-radius:20px;min-height:520px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#2B231B 0%,#241D16 58%,#1D1812 100%);
}
.b .eyebrow{font-size:12px;line-height:16px;color:var(--text2);letter-spacing:1.1px;font-weight:600}
.b .block-title{font-size:30px;line-height:36px;font-weight:800;letter-spacing:-.6px;margin-top:6px;color:var(--text)}
.b .block-meta{font-size:15px;line-height:21px;color:var(--text2);margin-top:6px}
.b .block-meta b{color:var(--text);font-weight:600}
.b .block-top{display:flex;align-items:center;justify-content:space-between}
.b .edit{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:4px}
.b .edit svg{width:14px;height:14px}
.b .rows{margin-top:22px}
.b .row{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;height:56px}
.b .row .idx{font-size:12px;color:var(--text2)}
.b .row .name{font-size:22px;line-height:28px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.b .row .right{display:flex;align-items:baseline;gap:10px;justify-content:flex-end;min-width:0}
.b .row .sets{font-size:16px;color:var(--text2);text-align:right;white-space:nowrap}
.b .row .wt{font-size:18px;color:var(--text2);text-align:right;white-space:nowrap;font-weight:600}
.b .row .wt i{font-style:normal;font-size:11px;color:var(--text3);margin-left:2px}
.b .cta{width:100%;height:72px;margin-top:auto;border:0;border-radius:999px;background:linear-gradient(180deg,#F08A5B 0%,#E2663A 42%,#D65B2D 100%);color:var(--accent-ink);font-family:inherit;font-size:20px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:10px}
.b .cta svg{width:18px;height:18px}
.b .fact{margin-top:auto;height:52px;display:flex;align-items:center;color:var(--text2);font-size:15px;letter-spacing:.2px}
.b .fact .chev{margin-left:auto;width:16px;height:16px;color:var(--text3)}
.b .fact .quiet{color:var(--text3);margin-left:8px}
.b .progress-block{min-height:0}
.b .p-top{display:flex;align-items:center;justify-content:space-between}
.b .period{display:flex;gap:18px}
.b .period b{font-size:13px;color:var(--text2);font-weight:500}
.b .period b.on{color:var(--text);font-weight:700}
.b .hero-label{font-size:12px;color:var(--text2);letter-spacing:1.1px;margin-top:30px;font-weight:600}
.b .metric{font-size:56px;line-height:60px;font-weight:800;letter-spacing:-2px;color:var(--text);margin-top:6px}
.b .metric i{font-style:normal;font-size:18px;font-weight:500;color:var(--text3);letter-spacing:.2px;margin-left:8px}
.b .sub{font-size:15px;color:var(--text2);margin-top:4px}
.b .p-fact{font-size:17px;color:var(--text2);margin-top:20px}
.b .p-fact b{color:var(--text);font-weight:600}
.b .chart-wrap{margin-top:32px;height:210px}
.b .chart-wrap svg{width:100%;height:200px;display:block}
.b .all{margin-top:auto;height:44px;display:flex;align-items:center;color:var(--text2);font-size:15px;letter-spacing:.2px}
.b .all svg{margin-left:auto;width:16px;height:16px;color:var(--text3)}

/* ── flat tab bar（不用玻璃/阴影） ─────────── */
.tabbar{position:absolute;left:24px;right:24px;bottom:18px;height:58px;border-radius:18px;background:#12100D;border:1px solid #2E2822;display:flex;align-items:center;justify-content:space-around;padding:0 6px;z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:92px;height:46px;color:var(--text3);font-size:11px;font-weight:500}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent-text);font-weight:600}
.home-indicator{position:absolute;left:50%;bottom:7px;width:134px;height:5px;border-radius:3px;transform:translateX(-50%);background:rgba(247,243,237,.24);z-index:6}
</style></head><body><div class="stage b">
