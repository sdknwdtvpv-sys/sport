<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>训练：只留「当前组 + 记录」 · 结构减负</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  width:848px;background:#070504;color:#EDE7DE;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;padding:22px 24px 18px;
}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px}
.kicker{font-size:11px;letter-spacing:1.8px;color:#F29A72;font-weight:600}
h1{font-size:21px;font-weight:700;letter-spacing:-.3px;margin-top:5px}
.sub{font-size:11.5px;color:#857C71;line-height:1.55;margin-left:auto;max-width:470px}
.frames{display:flex;gap:20px;align-items:flex-start}
figure{width:390px;flex:0 0 390px;margin:0}
figcaption{font-size:12px;color:#B4AB9E;margin-bottom:7px;letter-spacing:.2px}
figcaption b{color:#EDE7DE;font-weight:600}
.frame{width:390px;height:844px;border-radius:18px;overflow:hidden;border:1px solid #352E26;background:#090706;box-shadow:0 18px 40px -24px rgba(0,0,0,.9)}
.frame>img{display:block;width:390px;height:844px;object-fit:cover}
.stage{position:relative;width:390px;height:844px;overflow:hidden;
  background:
    radial-gradient(118% 44% at 80% -6%, rgba(226,102,58,.075), rgba(226,102,58,0) 62%),
    linear-gradient(180deg,#0B0907 0%,#090706 56%,#080605 100%);
}
.foot{margin-top:12px;font-size:11px;color:#857C71;line-height:1.6}
.foot b{color:#B4AB9E;font-weight:600}

/* ── phone chrome ───────────────────────────── */
.sb{height:46px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 7px 24px;color:#F7F3ED;font-size:14px;font-weight:600;letter-spacing:.15px}
.sb-right{display:flex;align-items:center;gap:6px}
.sb svg{display:block}
.content{position:absolute;top:46px;left:24px;right:24px;bottom:0;padding-bottom:96px;display:flex;flex-direction:column}
.topbar{height:60px;display:flex;align-items:center;gap:12px;flex:0 0 auto}
.page-title{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.5px;color:#F7F3ED}
.date{font-size:12px;line-height:18px;color:#8D8478;font-weight:500;letter-spacing:.2px}
.actions{margin-left:auto;display:flex;align-items:center;gap:10px;color:#B6AC9F}
.actions svg{width:21px;height:21px;display:block}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ── shared ─────────────────────────────────── */
.card{
  background:
    radial-gradient(130% 100% at 50% -22%, rgba(255,214,186,.06), rgba(255,214,186,0) 56%),
    linear-gradient(180deg,#211B14 0%,#1A1510 55%,#18130F 100%);
  border:1px solid #463D33;border-radius:12px;
  box-shadow:inset 0 1px 0 rgba(255,246,234,.08), 0 10px 24px -16px rgba(0,0,0,.88);
}
.eyebrow{font-size:12px;line-height:16px;font-weight:600;letter-spacing:1.2px;color:#8D8478}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.accent-btn svg{width:16px;height:16px}
.accent-btn{
  width:100%;height:64px;border:0;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,#F08A5B 0%,#E2663A 42%,#D65B2D 100%);
  color:#1A0F0A;font-family:inherit;font-size:17px;font-weight:700;letter-spacing:.2px;
  box-shadow:0 10px 24px -12px rgba(226,102,58,.35),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.16);
}
.tabbar{
  position:absolute;left:24px;right:24px;bottom:18px;height:58px;border-radius:29px;
  background:linear-gradient(180deg,rgba(52,44,36,.78),rgba(29,24,19,.87));
  border:1px solid rgba(255,246,234,.10);box-shadow:inset 0 1px 0 rgba(255,246,234,.12),0 18px 36px -18px rgba(0,0,0,.9);
  display:flex;align-items:center;justify-content:space-around;padding:0 6px;z-index:5;
}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:92px;height:46px;border-radius:23px;color:#B6AC9F;font-size:11px;font-weight:500}
.tab svg{width:22px;height:22px}
.tab.on{color:#F29A72;font-weight:600;background:linear-gradient(180deg,rgba(255,246,234,.085),rgba(255,246,234,.028));box-shadow:inset 0 1px 0 rgba(255,246,234,.12)}
.home-indicator{position:absolute;left:50%;bottom:7px;width:134px;height:5px;border-radius:3px;transform:translateX(-50%);background:rgba(247,243,237,.26);z-index:6}

/* ── HOME slim ─────────────────────────────── */
.home-card{margin-top:28px;padding:20px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between}
.edit{display:flex;align-items:center;gap:4px;color:#B6AC9F;font-size:12px;font-weight:500;letter-spacing:.2px;padding:2px 0}
.edit svg{width:14px;height:14px}
.plan-title{margin-top:5px;font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.3px;color:#F7F3ED}
.plan-meta{margin-top:4px;font-size:12px;line-height:16px;color:#8D8478;letter-spacing:.2px}
.plan-table{margin-top:18px;border-top:1px solid #28221A}
.plan-head{display:grid;grid-template-columns:24px 1fr 76px 64px;gap:8px;height:30px;align-items:center;border-bottom:1px solid #28221A}
.plan-head span{font-size:12px;color:#8D8478;font-weight:500;letter-spacing:.2px}
.plan-head .r{text-align:right}
.plan-row{display:grid;grid-template-columns:24px 1fr 76px 64px;gap:8px;height:48px;align-items:center;border-bottom:1px solid rgba(70,61,51,.45)}
.plan-row:last-child{border-bottom:0}
.plan-row .idx{font-size:12px;color:#8D8478}
.plan-row .name{font-size:17px;line-height:22px;font-weight:600;color:#F7F3ED;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-row .sets{font-size:15px;color:#B6AC9F;text-align:right;white-space:nowrap}
.plan-row .wt{font-size:15px;color:#B6AC9F;text-align:right;white-space:nowrap}
.plan-row .wt i{font-style:normal;font-size:10px;color:#8D8478;margin-left:2px}
.home-card .accent-btn{margin-top:20px}
.home-foot{margin-top:auto;height:48px;display:flex;align-items:center;border-top:1px solid #28221A;color:#8D8478;font-size:12px;letter-spacing:.2px}
.home-foot .sep{margin:0 8px;color:#463D33}
.home-foot .chev{margin-left:auto;color:#8D8478;width:14px;height:14px}

/* ── WORKOUT slim ──────────────────────────── */
.w-content{position:absolute;top:46px;left:24px;right:24px;bottom:0;padding-bottom:34px;display:flex;flex-direction:column}
.w-head{height:60px;display:flex;align-items:center;gap:12px;flex:0 0 auto}
.back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#B6AC9F;margin-left:-8px}
.back svg{width:20px;height:20px}
.w-title{font-size:20px;line-height:26px;font-weight:700;color:#F7F3ED;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.w-pos{font-size:12px;color:#8D8478;letter-spacing:.2px}
.w-menu{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#B6AC9F;border:1px solid rgba(255,246,234,.08);border-radius:999px;background:rgba(255,246,234,.04)}
.w-menu svg{width:18px;height:18px}
.w-card{margin-top:28px;padding:0;overflow:hidden}
.w-thead{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #3B332B}
.w-thead .a{font-size:12px;color:#8D8478;letter-spacing:.2px}
.w-thead .b{font-size:12px;color:#B6AC9F;letter-spacing:.2px}
.w-row{display:grid;grid-template-columns:24px 1fr 44px;gap:8px;align-items:center;height:60px;padding:0 20px;border-bottom:1px solid rgba(70,61,51,.45)}
.w-row:last-child{border-bottom:0}
.w-row .idx{font-size:12px;color:#8D8478}
.w-row .wt{font-size:15px;color:#B6AC9F;font-weight:600;white-space:nowrap}
.w-row .wt i{font-style:normal;font-size:10px;color:#8D8478;margin-left:2px}
.w-row .rp{font-size:15px;color:#B6AC9F;text-align:right}
.w-row.now{background:rgba(226,102,58,.13);box-shadow:inset 3px 0 0 #F29A72}
.w-row.now .idx{color:#F29A72}
.w-row.now .wt,.w-row.now .rp{color:#F7F3ED}
.w-row.future{opacity:.42}
.w-gap{flex:1}
.w-footer{flex:0 0 auto}
.w-record{width:100%;height:88px;border:0;border-radius:999px;background:linear-gradient(180deg,#F08A5B 0%,#E2663A 44%,#D65B2D 100%);color:#1A0F0A;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px -12px rgba(226,102,58,.35),inset 0 1px 0 rgba(255,255,255,.28)}
.w-record b{font-size:28px;font-weight:700;letter-spacing:-.5px}
.w-record b i{font-style:normal;font-size:14px;font-weight:600;letter-spacing:0;margin:0 2px}
.w-record svg{width:20px;height:20px}
.w-switch{height:44px;display:flex;align-items:center;justify-content:space-between;color:#8D8478;font-size:15px;letter-spacing:.1px}
.w-switch span{display:flex;align-items:center;gap:4px;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-switch svg{width:14px;height:14px}

/* ── PROGRESS slim ─────────────────────────── */
.p-top{height:60px;display:flex;align-items:center;gap:12px;flex:0 0 auto}
.p-hero{margin-top:28px;display:flex;flex-direction:column}
.p-hero-top{display:flex;align-items:center;justify-content:space-between}
.p-label{font-size:12px;color:#8D8478;letter-spacing:.2px}
.seg{display:flex;height:30px;padding:2px;border-radius:9px;background:#211B14;border:1px solid #463D33}
.seg span{min-width:44px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#B6AC9F;border-radius:7px}
.seg span.on{background:linear-gradient(180deg,#F4F0E9,#E7E0D5);color:#17120D;font-weight:600}
.p-big{font-size:34px;line-height:40px;font-weight:700;letter-spacing:-.8px;margin-top:8px;color:#F7F3ED}
.p-big i{font-style:normal;font-size:13px;color:#8D8478;font-weight:500;letter-spacing:.2px;margin-left:5px}
.p-sub{font-size:12px;color:#8D8478;margin-top:2px}
.p-fact{font-size:15px;color:#B6AC9F;margin-top:14px;letter-spacing:.2px}
.p-fact b{color:#F7F3ED;font-weight:600}
.p-chart-card{margin-top:32px;padding:20px}
.p-chart-head{display:flex;align-items:baseline;justify-content:space-between}
.p-chart-title{font-size:15px;font-weight:600;color:#F7F3ED}
.p-legend{font-size:12px;color:#8D8478}
.p-legend i{display:inline-block;width:12px;height:2px;background:#F29A72;vertical-align:2px;margin-right:4px;border-radius:1px}
.p-chart{display:block;width:100%;height:180px;margin-top:10px;overflow:visible}
.p-xaxis{display:flex;justify-content:space-between;margin-top:4px;font-size:12px;color:#8D8478}
.p-sparse{font-size:12px;color:#8D8478;margin-top:10px}
.p-all{margin-top:auto;height:48px;display:flex;align-items:center;border-top:1px solid #28221A;color:#F29A72;font-size:12px;letter-spacing:.2px}
.p-all .chev{margin-left:auto;width:14px;height:14px}

/* ── PROFILE slim ──────────────────────────── */
.pr-card{margin-top:28px;padding:20px}
.pr-id{display:flex;align-items:center;gap:14px}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,rgba(226,102,58,.28),rgba(226,102,58,.10));border:1px solid rgba(242,154,114,.35);display:flex;align-items:center;justify-content:center;color:#F29A72}
.avatar svg{width:24px;height:24px}
.pr-name{font-size:17px;font-weight:600;color:#F7F3ED}
.pr-sub{font-size:12px;color:#8D8478;margin-top:2px}
.pr-level{display:flex;align-items:baseline;justify-content:space-between;margin-top:18px}
.pr-level b{font-size:22px;line-height:28px;font-weight:700;color:#F7F3ED;letter-spacing:-.2px}
.pr-level span{font-size:15px;color:#B6AC9F}
.pr-bar{height:4px;border-radius:2px;background:#332E28;margin-top:10px;overflow:hidden}
.pr-bar i{display:block;width:20%;height:100%;border-radius:2px;background:#E2663A}
.pr-fact{font-size:12px;color:#8D8478;margin-top:10px;letter-spacing:.2px}
.pr-ach{margin-top:auto;height:56px;display:flex;align-items:center;border-top:1px solid #28221A;border-bottom:1px solid #28221A;color:#B6AC9F}
.pr-ach .name{font-size:15px;color:#F7F3ED;font-weight:600}
.pr-ach .val{margin-left:auto;font-size:12px;color:#8D8478}
.pr-ach svg{width:14px;height:14px;margin-left:8px;color:#8D8478}
