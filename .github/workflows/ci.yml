name: CI
# CI 跑的就是门禁本身：`./verify.sh`（六层），与本地同一条命令、同一个退出码。
#
# 2026-09-30 用户拍板 —— 在此之前 CI 只是门禁的一部分（不做场景级 eval、不做一批
# node 守卫、不做第 6 层变异测试），于是"CI 绿"和"门禁绿"是两件事，而 README 上的
# 徽章会让人以为它们等价。现在两边是同一个东西，没有第二种口径。
#
# 为了让它能在 ubuntu 上真的跑完，门禁里两处**只属于开发机**的东西被改成"不适用"
# 而不是失败（见 `verify.sh` 里 DEPS 那段），plist 读写也补了一个不依赖 macOS
# `plutil` 的实现（`tool/lib/plist.mjs`）—— 否则那条 iOS 自检在 CI 上会"跳过"，
# 等于悄悄没有。
#
# 环境钉版本 —— 与"锁定 Flutter 3.47.5"同一个理由：CI 必须验证一个**已知环境**。
#   * runs-on: ubuntu-24.04 —— GitHub 公告 ubuntu-latest 将于 2026-10-19 起迁移到
#     Ubuntu 26，届时 ubuntu-latest 会静默变成另一个系统。
#   * actions/*@v5 —— v4 面向 Node.js 20，GitHub 已标记弃用并强制跑在 Node.js 24 上。
#   * node 22 —— 服务端自检用 `node:sqlite`（22.5+ 才有），版本漂了会红得莫名其妙。
# 复查时间：2027-01，或收到 GitHub 弃用公告时。

on:
  push:
  pull_request:

jobs:
  gate:
    name: 六层门禁（./verify.sh，与本地同一条命令）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # 门禁的契约层与后端自检都要 Node；`node:sqlite` 要 22.5+，所以钉 22。
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: subosito/flutter-action@v2
        with:
          # 锁版本：CI 必须验证"我验证过的那一版"，channel: stable 会让 lint 规则
          # 与格式随上游漂移，突然红掉却与本仓库无关。
          flutter-version: '3.47.5'
          cache: true

      # 一条命令跑完六层（第 0 层引导 pub get + build_runner 也在这条命令里）。
      # 不许加 `--fast`：那会跳过第 5 层，CI 就又变成"看着像门禁"的东西了。
      - name: 门禁（./verify.sh 六层全跑）
        run: |
          set -o pipefail
          ./verify.sh 2>&1 | tee /tmp/lianleme-gate.log

      # 门禁的**账目**：绿了也要能证明"六层真的都跑了，而且没有一层被环境挡下"。
      #
      # 为什么需要这一步：`verify.sh` 的约定是"环境导致的无法执行 = 阻塞，不计入失败" ——
      # 这在开发机上是**对的**（环境坏了和测试失败是两件事），但在 CI 上很危险：
      # 少了 Dart、pub get 拉不动、路径含撇号……都可能让某一层"没跑"而整条命令照样 exit 0，
      # 于是**绿得无声无息**（这个仓库最怕的就是这种绿）。所以 CI 上把话反过来讲：
      # 六层的标记必须都在日志里，且**不许有一个"⊘ 阻塞"**。
      # 另外：GitHub 的 job 日志要凭据才读得到（匿名 API 403），这步的成绩会打印在
      # 步骤名旁边 —— 绿不绿之外，至少能看出它过了这道账。
      - name: 门禁账目（六层都跑了且零阻塞）
        run: |
          set -e
          for layer in '[1/6]' '[2/6]' '[3/6]' '[4/6]' '[5/6]' '[6/6]'; do
            if ! grep -qF -- "$layer" /tmp/lianleme-gate.log; then
              echo "::error::门禁日志里没有 $layer —— 那一层没跑（CI 上「没跑」不许算绿）"
              exit 1
            fi
          done
          if grep -qF -- '⊘ 阻塞' /tmp/lianleme-gate.log; then
            echo "::error::门禁里有步骤被环境阻塞 —— CI 上这等于「没验到」，不许算绿"
            grep -F -- '⊘ 阻塞' /tmp/lianleme-gate.log || true
            exit 1
          fi
          if ! grep -qF -- '未发现失败' /tmp/lianleme-gate.log; then
            echo "::error::门禁日志里没有「未发现失败」"
            exit 1
          fi
          echo "✓ 六层都跑了、零阻塞、未发现失败 —— 这次「CI 绿」就是「门禁绿」"

      # 门禁红了要能**一眼看出红在哪一层**。
      # 为什么要单独一步：GitHub 的 job 日志要凭据才读得到（匿名 API 403），
      # 而**注解**（::error::）在公开仓库上匿名可读 —— 所以把红的那几行抬出来，
      # 否则"CI 红了"就只是一句没有下文的话。这一步不做任何检查，只搬日志。
      - name: 失败原因（把门禁里红的那几行抬成注解）
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' /tmp/lianleme-gate.log \
            | grep -E '✗|⊘|未发现失败|有检查未通过|^\[[0-9]/6\]' | tail -25 \
            | sed 's/^/::error::/' || true
