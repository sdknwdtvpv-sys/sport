name: CI

# 环境钉版本 —— 与"锁定 Flutter 3.47.5"同一个理由：
# CI 必须验证一个**已知环境**，不能让上游悄悄换掉它。
#   * runs-on: ubuntu-24.04 —— GitHub 公告 ubuntu-latest 将于 2026-10-19 起迁移到 Ubuntu 26，
#     届时 ubuntu-latest 会静默变成另一个系统，可能与本仓库验证过的环境不同。
#   * actions/*@v5 —— v4 面向 Node.js 20，GitHub 已标记弃用并强制跑在 Node.js 24 上（会产生告警）。
# 复查时间：2027-01，或收到 GitHub 弃用公告时。

on:
  push:
  pull_request:

jobs:
  # ── 契约层：动作库 + JS 引擎 ────────────────────────────────────────────
  # 这一层不需要 Flutter，跑得快，所以先跑，快速失败。
  contracts:
    name: 契约自检（动作库 + JS 规则引擎）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 重建动作库种子（校验失败即退出非 0）
        run: node seed/build.mjs

      - name: 生成物必须与提交一致
        run: |
          if ! git diff --quiet -- seed/exercises.json seed/exercises.sql; then
            echo "::error::seed/exercises.json 或 exercises.sql 与 seed/parts/*.json 不一致。请本地执行 node seed/build.mjs 后一并提交。"
            git diff --stat -- seed/exercises.json seed/exercises.sql
            exit 1
          fi

      - name: JS 规则引擎测试向量
        run: node engine/run-tests.mjs

  # ── 应用层：Flutter 分析 + 测试 ─────────────────────────────────────────
  # Dart 端引擎读的是仓库根目录的 engine/vectors.json（与 JS 同一份规格）。
  # 这一步绿了，才说明"移植完成"。
  app:
    name: Flutter 分析 + 测试（含 Dart 引擎向量）
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          # 锁定版本：CI 必须验证"我验证过的那一版"。
          # 用 channel: stable 会让 lint 规则与格式随上游漂移，突然红掉却与本仓库无关。
          flutter-version: '3.47.5'
          cache: true

      - name: 纯 Dart 领域校验（零依赖，放在 pub get 之前做快速失败）
        run: dart tool/check_domain.dart

      - name: 拉取依赖
        run: flutter pub get

      - name: 代码生成（drift）
        # 必须早于 analyze：db.g.dart 是 part 文件，缺了它 analyze 必然报
        # "Target of URI doesn't exist"。
        run: dart run build_runner build

      - name: 静态分析（dart analyze --fatal-infos）
        # 刻意不用 `flutter analyze`：Flutter 3.47 的它遇到**非 ASCII 路径**会崩
        # （flutter/flutter#191309，FormatException / analysis server exit 255）。
        # 两者读同一套 analysis_options.yaml，dart analyze 不经过 flutter_tools 的 LSP 客户端。
        # --fatal-infos 比默认更严格：info 级也不放过。
        run: dart analyze --fatal-infos

      - name: 单元测试 + widget 测试
        run: flutter test --reporter expanded
